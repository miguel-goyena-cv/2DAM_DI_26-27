<table class="table">
    <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Email</th>
            <th scope="col">Message</th>
        </tr>
    </thead>
    <tbody>
        @for (contact of listarContactos(); track $index){
        <tr>
            <th scope="row">$index</th>
            <td>{{contact.email}}</td>
            <td>{{contact.description}}</td>
        </tr>
        }
    </tbody>
</table>
